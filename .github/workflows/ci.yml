name: C++ Graph Engine CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Install Dependencies (OpenMP, MPI)
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libomp-dev openmpi-bin libopenmpi-dev

    - name: Install CUDA Toolkit
      uses: Jimver/cuda-toolkit@master
      id: cuda-toolkit
      with:
        cuda: '12.0.0'
        # Install minimal toolkit to compile .cu files (nvcc)
        
    - name: Configure CMake
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCOVERAGE=ON

    - name: Build
      run: cmake --build build --config Release -j$(nproc)

    - name: Run Tests
      working-directory: build
      run: ctest --output-on-failure
      
    - name: Generate Code Coverage (LCOV)
      run: |
        sudo apt-get install lcov
        lcov --capture --directory build/src --output-file coverage.info
        lcov --remove coverage.info '/usr/*' '*/tests/*' '*/external/*' --output-file coverage.info
        lcov --list coverage.info

    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.info
        fail_ci_if_error: false
