name: C++ Graph Engine CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Install Dependencies (OpenMP, MPI)
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libomp-dev openmpi-bin libopenmpi-dev

    - name: Install CUDA Toolkit
      uses: Jimver/cuda-toolkit@v11.7.0
      id: cuda-toolkit
      with:
        cuda: '12.0.0'
        # Install minimal toolkit to compile .cu files (nvcc)
        
    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake ..

    - name: Build C++ Engine
      run: |
        cd build
        make -j4

    - name: Run Unit Tests (Google Test)
      run: |
        cd build
        ./tests/test_algorithms
